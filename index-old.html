<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Chips (play money)</title>
<style>
  :root { --bg:#14111c; --card:#1f1a2e; --gold:#f5c542; --text:#f3eefc; --muted:#9a90b5; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  .badge { background:var(--gold); color:#222; font-weight:700; font-size:12px; padding:6px 12px; border-radius:999px; }
  h1 { color:var(--gold); margin:16px 0 4px; }
  .card { background:var(--card); border-radius:14px; padding:20px; width:100%; max-width:380px; margin-top:16px; }
  input, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:1px solid #3a3350;
                  background:#2a2340; color:var(--text); font-size:16px; }
  button { background:var(--gold); color:#222; font-weight:700; border:0; cursor:pointer; }
  button.link { background:none; color:var(--muted); font-weight:400; text-decoration:underline; }
  #err { color:var(--bad); min-height:20px; margin-top:8px; font-size:14px; }
  .chips { font-size:36px; color:var(--gold); font-weight:700; }
  ol { padding-left:20px; color:var(--muted); } li span { color:var(--text); }
  .hide { display:none; }
</style>
</head>
<body>
  <span class="badge">PLAY MONEY ONLY: chips have no real value</span>
  <h1>🎰 Lucky Chips</h1>

  <div class="card" id="auth">
    <div id="mode">Log in</div>
    <input id="u" placeholder="Username" autocomplete="username" maxlength="20">
    <input id="p" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
    <button id="go">Log in</button>
    <button class="link" id="swap">No account? Sign up</button>
    <div id="err"></div>
  </div>

  <div class="card hide" id="home">
    <div>Welcome, <b id="name"></b></div>
    <div class="chips"><span id="chips">0</span> chips</div>
    <div id="game"><!-- mount your games here --></div>
    <button class="link" id="out">Log out</button>
  </div>

  <div class="card">
    <b>Leaderboard</b>
    <ol id="lb"></ol>
  </div>

<script>
let signup = false;
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const r = await fetch(path, body ? { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

function show(user) {
  $("auth").classList.toggle("hide", !!user);
  $("home").classList.toggle("hide", !user);
  if (user) { $("name").textContent = user.username; $("chips").textContent = user.chips.toLocaleString(); }
}

async function loadBoard() {
  const rows = await api("/api/leaderboard");
  $("lb").innerHTML = "";
  rows.forEach((r) => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.textContent = r.username; // textContent: no HTML injection
    li.append(s, " - " + r.chips.toLocaleString());
    $("lb").append(li);
  });
}

$("swap").onclick = () => {
  signup = !signup;
  $("mode").textContent = signup ? "Create account" : "Log in";
  $("go").textContent = signup ? "Sign up" : "Log in";
  $("swap").textContent = signup ? "Have an account? Log in" : "No account? Sign up";
  $("err").textContent = "";
};

$("go").onclick = async () => {
  try {
    show(await api(signup ? "/api/signup" : "/api/login", { username:$("u").value, password:$("p").value }));
    $("p").value = ""; $("err").textContent = ""; loadBoard();
  } catch (e) { $("err").textContent = e.message; }
};

$("out").onclick = async () => { await api("/api/logout", {}); show(null); loadBoard(); };

(async () => { try { show(await api("/api/me")); } catch { show(null); } loadBoard(); })();
</script>
</body>
</html>
