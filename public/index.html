<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1c">
  <title>TAX Casino</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f0e8;
      background: #100b1c;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(111, 71, 161, .27), transparent 42%),
        radial-gradient(ellipse at 95% 40%, rgba(179, 124, 48, .08), transparent 30%),
        #100b1c;
    }

    button, input { font: inherit; }

    .site-shell {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    .brand {
      margin: 0 0 22px;
      text-align: center;
    }

    h1 {
      margin: 13px 0 0;
      color: #fff8ed;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 7vw, 3.5rem);
      letter-spacing: -.035em;
      line-height: 1.08;
      text-shadow: 0 3px 20px rgba(240, 201, 107, .18);
    }

    .card {
      padding: clamp(22px, 5vw, 34px);
      border: 1px solid rgba(227, 190, 255, .16);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(36, 28, 52, .98), rgba(25, 19, 38, .98));
      box-shadow:
        0 0 0 5px rgba(169, 119, 213, .08),
        0 28px 80px rgba(0, 0, 0, .42),
        inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .auth-card {
      width: min(100%, 460px);
      margin: 0 auto 22px;
    }

    .card-heading {
      margin: 0;
      color: #fff8ed;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      text-align: center;
    }

    .card-subtitle {
      margin: 8px 0 23px;
      color: #aaa2b8;
      font-size: .93rem;
      line-height: 1.5;
      text-align: center;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-top: 15px;
      color: #d8d0e4;
      font-size: .85rem;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid #504264;
      border-radius: 11px;
      outline: none;
      background: #120e1b;
      color: #f5f0e8;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .field input::placeholder { color: #8d829d; }

    .field input:focus-visible {
      border-color: #f0c96b;
      box-shadow: 0 0 0 3px rgba(240, 201, 107, .18);
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid #f1d27e;
      border-radius: 13px;
      background: linear-gradient(180deg, #e3bd62, #bc8d32);
      box-shadow: 0 5px 0 #805b1d, 0 8px 18px rgba(0, 0, 0, .22);
      color: #241a08;
      cursor: pointer;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }

    .primary-button { width: 100%; margin-top: 22px; }

    .primary-button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #f0d27f, #c99a3c);
    }

    .primary-button:active:not(:disabled) { transform: translateY(2px); }

    .primary-button:disabled { cursor: wait; opacity: .65; }

    button:focus-visible {
      outline: 3px solid #fff0b8;
      outline-offset: 4px;
    }

    .text-button {
      display: block;
      margin: 17px auto 0;
      padding: 5px 8px;
      border: 0;
      background: transparent;
      color: #d5c7e4;
      cursor: pointer;
      font-size: .9rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .text-button:disabled { cursor: wait; opacity: .6; }
    .text-button:hover:not(:disabled) { color: #ffe8a4; }

    .error {
      min-height: 1.4em;
      margin: 13px 0 0;
      color: #ff9b88;
      font-size: .9rem;
      line-height: 1.45;
    }

    .server-notice {
      margin: 18px 0 0;
      padding: 13px 15px;
      border: 1px solid rgba(241, 210, 126, .45);
      border-radius: 12px;
      background: rgba(25, 19, 38, .92);
      color: #f0c96b;
      font-size: .9rem;
      line-height: 1.55;
    }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      body { padding: 24px 12px; }
      .card { border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="brand">
      <h1>TAX Casino</h1>
    </header>

    <section class="card auth-card" id="auth-view" aria-labelledby="auth-title">
      <h2 class="card-heading" id="auth-title">Log in</h2>
      <p class="card-subtitle" id="auth-subtitle">Welcome back. Sign in to your table.</p>
      <p class="card-subtitle">Virtual chips only. No deposits, withdrawals, or cash prizes.</p>

      <p class="server-notice" id="server-notice" role="status" hidden></p>
      <form id="auth-form" novalidate>
        <label class="field" for="username">
          Username
          <input
            id="username"
            name="username"
            type="text"
            placeholder="3–20 letters, numbers or underscores"
            autocomplete="username"
            minlength="3"
            maxlength="20"
            pattern="[A-Za-z0-9_]{3,20}"
            required
          >
        </label>
        <label class="field" for="password">
          Password
          <input
            id="password"
            name="password"
            type="password"
            placeholder="8–72 characters"
            autocomplete="current-password"
            minlength="8"
            maxlength="72"
            required
          >
        </label>
        <p class="error" id="auth-error" role="alert" aria-live="polite"></p>
        <button class="primary-button" id="submit-button" type="submit">Log in</button>
      </form>
      <button class="text-button" id="mode-toggle" type="button">New here? Create an account</button>
    </section>

  </main>

  <script>
    const elements = {
      authForm: document.querySelector("#auth-form"),
      authTitle: document.querySelector("#auth-title"),
      authSubtitle: document.querySelector("#auth-subtitle"),
      serverNotice: document.querySelector("#server-notice"),
      username: document.querySelector("#username"),
      password: document.querySelector("#password"),
      authError: document.querySelector("#auth-error"),
      submitButton: document.querySelector("#submit-button"),
      modeToggle: document.querySelector("#mode-toggle")
    };

    let isSignup = false;
    let requestPending = false;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        credentials: "same-origin",
        ...options,
        headers: options.body
          ? { "Content-Type": "application/json", ...options.headers }
          : options.headers
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an invalid response. Please try again.");
      }

      if (!response.ok) {
        const error = new Error(typeof data.error === "string" ? data.error : "Request failed. Please try again.");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function setPending(pending) {
      requestPending = pending;
      elements.submitButton.disabled = pending;
      elements.modeToggle.disabled = pending;
      elements.username.disabled = pending;
      elements.password.disabled = pending;
      elements.submitButton.textContent = pending
        ? (isSignup ? "Creating account…" : "Logging in…")
        : (isSignup ? "Sign up" : "Log in");
    }

    function setMode(signup) {
      isSignup = signup;
      elements.authTitle.textContent = signup ? "Create account" : "Log in";
      elements.authSubtitle.textContent = signup
        ? "Join the table and get your starting balance."
        : "Welcome back. Sign in to your table.";
      elements.password.autocomplete = signup ? "new-password" : "current-password";
      elements.modeToggle.textContent = signup
        ? "Already have an account? Log in"
        : "New here? Create an account";
      setPending(false);
      elements.authError.textContent = "";
    }

    function validateCredentials(username, password) {
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        return "Username must be 3–20 letters, numbers, or underscores.";
      }
      if (password.length < 8 || password.length > 72) {
        return "Password must be 8–72 characters.";
      }
      return "";
    }

    elements.authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (requestPending) return;

      const username = elements.username.value.trim();
      const password = elements.password.value;
      const validationMessage = validateCredentials(username, password);
      if (validationMessage) {
        elements.authError.textContent = validationMessage;
        return;
      }

      elements.authError.textContent = "";
      setPending(true);
      try {
        await api(isSignup ? "/api/signup" : "/api/login", {
          method: "POST",
          body: JSON.stringify({ username, password })
        });
        window.location.replace("/lobby.html");
      } catch (error) {
        elements.authError.textContent = error.message;
      } finally {
        setPending(false);
      }
    });

    elements.modeToggle.addEventListener("click", () => {
      if (!requestPending) setMode(!isSignup);
    });

    async function initialize() {
      if (window.location.protocol === "file:") {
        elements.authTitle.textContent = "Start the casino server";
        elements.authSubtitle.textContent = "This page must be opened through the casino server to use login and games.";
        elements.serverNotice.textContent = "Open a terminal in the project folder and run `npm install` (first time only), then `npm start`. Once the server is running, open http://localhost:3000 in your browser instead of opening this HTML file directly.";
        elements.serverNotice.hidden = false;
        elements.authForm.hidden = true;
        elements.modeToggle.hidden = true;
        return;
      }

      setPending(true);
      try {
        await api("/api/me");
        window.location.replace("/lobby.html");
      } catch (error) {
        if (error.status !== 401) {
          elements.authError.textContent = error.message;
        }
      } finally {
        setPending(false);
      }
    }

    initialize();
  </script>
</body>
</html>
